{% extends 'layout.html' %}
{% block title %}Analytics{% endblock %}
{% block page_title %}Analytics{% endblock %}

{% block content %}
<div class="analytics-page">
  <div class="charts-grid">
    <div class="panel chart-panel">
      <div class="panel-header"><span>Category Breakdown</span><span class="badge-period">Last 30 days</span></div>
      <div class="chart-container"><canvas id="pieChart"></canvas></div>
    </div>
    <div class="panel chart-panel">
      <div class="panel-header"><span>Monthly Expenses</span><span class="badge-period">Last 6 months</span></div>
      <div class="chart-container"><canvas id="barChart"></canvas></div>
    </div>
    <div class="panel chart-panel chart-wide">
      <div class="panel-header"><span>Spending Trend</span><span class="badge-period">Last 30 days</span></div>
      <div class="chart-container chart-tall"><canvas id="lineChart"></canvas></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
{% endblock %}
